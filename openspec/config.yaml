schema: spec-driven

context: |
  Tech stack: TypeScript (strict), ESLint (owned ruleset in .eslint/), Prettier, Vitest.
  Quality commands: npm run lint / npm run typecheck / npm run test:run / npm run test:coverage.
  Coverage floor: 80% lines/functions/branches/statements (enforced in vitest.config.mts).
  npm scripts double as the gate — no separate CI pipeline exists yet.

rules:
  tasks:
    - Every phase that touches source files MUST end with a verification task running lint, typecheck, and tests (npm run lint && npm run typecheck && npm run test:run)
    - Every implementation task MUST have a paired test task, unless the change explicitly has no behavior to test (pure config/docs)
    - Coverage MUST NOT drop below the 80% threshold already enforced in vitest.config.mts; phases touching only .md/.json/config files MAY omit the coverage criterion but MUST say so explicitly
    - Never delete or skip an existing test to make the suite pass — if coverage or a test fails, fix the code or add tests
